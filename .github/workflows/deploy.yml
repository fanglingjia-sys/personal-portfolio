name: Build & Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# IMPORTANT for branch-based Pages deploy: workflow needs write access to
# push the built site back to the `gh-pages` branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static site
        run: |
          python tools/portfolio-site-builder/scripts/generate_portfolio_site.py \
            --input-dir . \
            --enable-prototype \
            --output-dir dist

      # NOTE: The official actions/*-pages family was returning 500 from
      # codeload.github.com when fetching their tarballs (2026-05-26).
      # Switched to peaceiris/actions-gh-pages, which is served from a
      # different release pipeline and is unaffected by that outage.
      #
      # IMPORTANT: After the first successful run, set the repo's
      # Settings → Pages → Source to "Deploy from a branch" → "gh-pages"
      # → "/ (root)" so GitHub serves what this action pushes.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
