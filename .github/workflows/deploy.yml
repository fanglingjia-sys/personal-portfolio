name: Build & Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static site
        run: |
          python tools/portfolio-site-builder/scripts/generate_portfolio_site.py \
            --input-dir . \
            --enable-prototype \
            --output-dir dist

      # NOTE: `actions/configure-pages` is intentionally NOT used here.
      # GitHub's codeload.github.com kept returning 500 for that action's
      # tarball (v5 + v4 both affected). Our site uses relative paths so
      # the base-URL env vars that configure-pages normally sets aren't
      # needed — upload-pages-artifact + deploy-pages work standalone.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
