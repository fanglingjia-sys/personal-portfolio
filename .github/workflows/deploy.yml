name: Build & Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static site
        run: |
          python tools/portfolio-site-builder/scripts/generate_portfolio_site.py \
            --input-dir . \
            --enable-prototype \
            --output-dir dist

      # codeload.github.com kept 500-ing for every actions/*-pages and
      # third-party gh-pages action tarball (2026-05-26 outage).
      # Plan D: no external Pages action — just commit ./dist to a
      # gh-pages branch using plain git + the auto-provided GITHUB_TOKEN.
      # This only needs the runner's pre-installed git binary.
      - name: Publish ./dist to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${COMMIT_MSG%%$'\n'*}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          # force-push as orphan: gh-pages branch always reflects the
          # latest build, no history accumulation
          git push --force origin gh-pages
